# Dev-only config: same worker, no containers block (local workerd cannot
# run firecracker containers - container tools are exercised on prod).
name = "prime"
account_id = "b04dd6c1528d6cf40ffd645269716025"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "DEVICES", class_name = "DeviceDO" },
  { name = "REGISTRY", class_name = "RegistryDO" },
  { name = "CODING_SANDBOX", class_name = "CodingSandbox" },
  { name = "FILES", class_name = "FilesDO" },
  { name = "FLEET", class_name = "FleetDO" },
]

# Local R2: miniflare simulates the bucket on disk, so the whole file pipeline
# can be exercised without R2 enabled on the account.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "code-mcp-files"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceDO", "RegistryDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CodingSandbox"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["FilesDO"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["FleetDO"]

# Per-address limits on what a caller with no standing may ask of the fleet routes (src/fleet-limits.ts).
# Counted across the isolates of a location, with no Durable Object or storage behind them, so they add
# nothing to the budget the fleet guard counts. The isolate keeps its own count as well, and
# FLEET_INVITE_RATE_MAX / FLEET_UNKNOWN_RATE_MAX set that one (and are where to tune these two).
# namespace_id only has to be unique among this account's rate limiters.
[[ratelimits]]
name = "FLEET_RL_INVITE"
namespace_id = "7101"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "FLEET_RL_UNKNOWN"
namespace_id = "7102"
simple = { limit = 60, period = 60 }

[[kv_namespaces]]
binding = "KV"
id = "d36acd23e12945058bf9910182deeec7"

[[d1_databases]]
binding = "DB"
database_name = "code-mcp-db"
database_id = "00e3f87d-928a-47ba-b6f0-d1c607bade9f"

[vars]
# Local development has no Cloudflare Access in front of /admin.
ADMIN_ACCESS = "off"
ENVIRONMENT = "dev"
VIRTUAL_DEVICE_IDS = "cloud"
# A fixed pepper for local runs only; a deployment sets its own secret.
TOKEN_PEPPER = "dev-pepper-not-secret-0123456789abcdef"
