name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the superseded run: while iterating, the
# longest wait was several full runs queued one after another.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Two components share this repository: api/ (the Cloudflare Worker) and cli/
# (the prime CLI, which embeds the device buddy - src/code-mcp.ts - and tests
# against the api). Each job runs only for the changes that can affect it, on
# pushes as well as pull requests: a README-only commit runs nothing heavy.
jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # contents: read is needed to check out a private repository; listing
    # the pull request's files needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflows: &workflows
              - '.github/**'
              - 'scripts/**'
            api:
              - *workflows
              - 'api/**'
            # The CLI embeds the device buddy and its end-to-end suite runs the api.
            cli:
              - *workflows
              - 'cli/**'
              - 'api/**'

  test:
    name: Typecheck + unit and smoke tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: bun run typecheck

      # The admin View dialog test drives the page in Chromium, so the browser
      # binary is needed here too (the sandbox suite lives in its own job below).
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('api/package-lock.json') }}

      - name: Install Chromium
        # apt plus a browser download, on a runner whose mirror is sometimes
        # unreachable: three tries, because a flaky mirror fails nothing else.
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::chromium install failed on attempt $attempt; retrying"
            sleep 10
          done
          exit 1

      # Unit, smoke, files and anonymous-device suites.
      - name: Unit and smoke tests
        # run-smoke.ts resolves bun via $BUN_PATH or ~/.bun/bin/bun
        # (setup-bun's install location on Linux runners).
        run: bun run test

  # The Sandbox page in a real Chromium, used by real MCP clients. A separate
  # job so it cannot hold up the unit results, and retried once: assertions that
  # watch an animation or a 10-second idle fade occasionally lose a race on a
  # loaded runner even when the page is correct.
  browser:
    name: Sandbox in Chromium
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('api/package-lock.json') }}

      - name: Install Chromium
        # apt plus a browser download, on a runner whose mirror is sometimes
        # unreachable: three tries, because a flaky mirror fails nothing else.
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "::warning::chromium install failed on attempt $attempt; retrying"
            sleep 10
          done
          exit 1

      - name: Sandbox in Chromium with MCP clients
        run: |
          set -euo pipefail
          # The suite drives real cursors and a 10-second idle fade: a loaded
          # runner can lose that race even when the page is correct.
          for attempt in 1 2; do
            if bun test/sandbox-browser.ts; then exit 0; fi
            echo "::warning::sandbox-browser failed on attempt $attempt; retrying once"
            sleep 5
          done
          exit 1

  cli:
    name: prime CLI (typecheck, unit, end-to-end)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('cli/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The end-to-end suite boots a local wrangler api, so the api's
      # dependencies must be installed even though the CLI itself has none.
      - name: Install api dependencies
        working-directory: api
        run: npm ci

      # A malformed ${{ }} is still valid YAML, so only GitHub's parser rejects
      # it - catch it here instead of in a red workflow run.
      - name: Validate workflow files
        run: bun scripts/check-workflows.ts

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: cli
        run: bun run typecheck

      - name: Unit tests
        working-directory: cli
        run: bun test

      - name: End-to-end tests
        working-directory: cli
        run: bun test/e2e.ts

  # The same CLI suites on Windows, x64 and Arm: the release ships .exe builds
  # for both, so they must actually run there - not just cross-compile.
  cli-windows:
    name: prime CLI on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            node-arch: x64
            e2e: true
          # workerd (wrangler's local runtime, used by the end-to-end gateway)
          # has no Windows Arm build, so Node runs as x64 under Windows'
          # emulation there. Bun - and so the CLI under test - stays native Arm.
          # The wrangler e2e is skipped (it is the slow part and is
          # architecture-independent JavaScript); unit tests and a native binary
          # still run.
          - os: windows-11-arm
            node-arch: x64
            e2e: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.node-arch }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('cli/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install gateway dependencies
        working-directory: api
        run: npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: cli
        run: bun run typecheck

      - name: Unit tests
        working-directory: cli
        run: bun test

      - name: End-to-end tests
        if: matrix.e2e
        working-directory: cli
        run: bun test/e2e.ts

      # The release ships this platform's .exe from a cross-compile on Linux;
      # build it natively too and make sure it starts and serves.
      - name: Build and smoke-test the native binary
        working-directory: cli
        run: bun scripts/build.ts --host-only

  # 'prime service' against each OS's real service manager: a systemd user unit,
  # a launchd agent, a Scheduled Task - installed, exercised, uninstalled.
  # windows-11-arm is deliberately absent: its emulated runner was slower than
  # every other job combined, and the service code is the same on both Arms.
  cli-service:
    name: prime service on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('cli/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      # CI jobs have no login session, so no systemd user manager: start one.
      - name: Start a systemd user session
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for i in $(seq 1 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user is-system-running || true

      - name: Install, exercise and uninstall the service
        working-directory: cli
        run: bun test/service-e2e.ts

      # A root installed in the OS store (how IT deploys TLS inspection) must be
      # trusted by the service's tunnel: NODE_USE_SYSTEM_CA=1 is what makes it so.
      - name: OS certificate store is trusted (NODE_USE_SYSTEM_CA)
        working-directory: cli
        env:
          CODE_MCP_SYSTEM_CA_TEST: '1'
        run: bun test/system-ca.ts

  # The device buddy that the CLI embeds. Its tests exercise the PowerShell
  # launcher (against a real PowerShell, present on all three runners) and the
  # spawn environment, and that the server starts.
  device-server:
    name: device buddy on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests (Python harness over the TS launcher)
        run: python -m unittest discover -s tests -v

      - name: The implementation starts
        shell: bash
        run: |
          set -euo pipefail
          bun src/code-mcp.ts --help | head -1
