name: CI

on:
  push:
    branches: [main]
  pull_request:

# Three components share this repository: gateway/ (the Cloudflare Worker),
# code-mcp/ (the device server, in TypeScript) and cli/ (the
# mcp command, which embeds code-mcp and tests against the gateway). A pull
# request runs the jobs its changes can affect; main always runs everything.
jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      gateway: ${{ github.event_name == 'push' || steps.filter.outputs.gateway == 'true' }}
      code-mcp: ${{ github.event_name == 'push' || steps.filter.outputs.code-mcp == 'true' }}
      cli: ${{ github.event_name == 'push' || steps.filter.outputs.cli == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflows: &workflows
              - '.github/**'
              - 'scripts/**'
            gateway:
              - *workflows
              - 'gateway/**'
            code-mcp:
              - *workflows
              - 'code-mcp/**'
            # The CLI embeds code-mcp and its end-to-end suite runs the gateway.
            cli:
              - *workflows
              - 'cli/**'
              - 'code-mcp/**'
              - 'gateway/**'

  test:
    name: Typecheck + unit and smoke tests
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and smoke tests
        # run-smoke.ts resolves bun via $BUN_PATH or ~/.bun/bin/bun
        # (setup-bun's install location on Linux runners).
        run: bun run test

  cli:
    name: mcp CLI (typecheck, unit, end-to-end)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The end-to-end suite boots a local wrangler gateway, so the gateway's
      # dependencies must be installed even though the CLI itself has none.
      - name: Install gateway dependencies
        working-directory: gateway
        run: npm ci

      # A malformed ${{ }} is still valid YAML, so only GitHub's parser rejects
      # it - catch it here instead of in a red workflow run.
      - name: Validate workflow files
        run: bun scripts/check-workflows.ts

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: cli
        run: bun run typecheck

      - name: Unit tests
        working-directory: cli
        run: bun test

      - name: End-to-end tests
        working-directory: cli
        run: bun test/e2e.ts

  # The same CLI suites on Windows, x64 and Arm: the release ships .exe builds
  # for both, so they must actually run there - not just cross-compile.
  cli-windows:
    name: mcp CLI on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node-arch: x64
          # workerd (wrangler's local runtime, used by the end-to-end gateway)
          # has no Windows Arm build, so Node runs as x64 under Windows'
          # emulation there. Bun - and so the CLI under test - stays native Arm.
          - os: windows-11-arm
            node-arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.node-arch }}

      - name: Install gateway dependencies
        working-directory: gateway
        run: npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: cli
        run: bun run typecheck

      - name: Unit tests
        working-directory: cli
        run: bun test

      - name: End-to-end tests
        working-directory: cli
        run: bun test/e2e.ts

      # The release ships this platform's .exe from a cross-compile on Linux;
      # build it natively too and make sure it starts and serves.
      - name: Build and smoke-test the native binary
        working-directory: cli
        run: bun scripts/build.ts --host-only

  # 'mcp service' against each OS's real service manager: a systemd user unit,
  # a launchd agent, a Scheduled Task - installed, exercised, uninstalled.
  cli-service:
    name: mcp service on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      # CI jobs have no login session, so no systemd user manager: start one.
      - name: Start a systemd user session
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for i in $(seq 1 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user is-system-running || true

      - name: Install, exercise and uninstall the service
        working-directory: cli
        run: bun test/service-e2e.ts

      # A root installed in the OS store (how IT deploys TLS inspection) must be
      # trusted by the service's tunnel: NODE_USE_SYSTEM_CA=1 is what makes it so.
      - name: OS certificate store is trusted (NODE_USE_SYSTEM_CA)
        working-directory: cli
        env:
          CODE_MCP_SYSTEM_CA_TEST: '1'
        run: bun test/system-ca.ts

  # code-mcp's three implementations. The tests check each one's PowerShell
  # launcher (and run it against real PowerShell, present on all three
  # runners), the spawn environment, and that every implementation starts.
  code-mcp:
    name: code-mcp on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code-mcp == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: code-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Tests (Python harness over the TS launcher)
        run: python -m unittest discover -s tests -v

      - name: The implementation starts
        shell: bash
        run: |
          set -euo pipefail
          bun code-mcp.ts --help | head -1
