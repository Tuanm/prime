name: CI

on:
  push:
    branches: [main]
  pull_request:

# Two components share this repository: api/ (the Cloudflare Worker) and cli/
# (the mcp command, which embeds the device server - src/code-mcp.ts - and tests
# against the api). A pull request runs the jobs its changes can affect; main
# always runs everything.
jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    # contents: read is needed to check out a private repository; listing
    # the pull request's files needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ github.event_name == 'push' || steps.filter.outputs.api == 'true' }}
      cli: ${{ github.event_name == 'push' || steps.filter.outputs.cli == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflows: &workflows
              - '.github/**'
              - 'scripts/**'
            api:
              - *workflows
              - 'api/**'
            # The CLI embeds the device server and its end-to-end suite runs the api.
            cli:
              - *workflows
              - 'cli/**'
              - 'api/**'

  test:
    name: Typecheck + unit and smoke tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: bun run typecheck

      # The admin dialog test drives the page in Chromium, and it runs with the
      # unit tests below (as well as the sandbox end-to-end test further down).
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Unit and smoke tests
        # run-smoke.ts resolves bun via $BUN_PATH or ~/.bun/bin/bun
        # (setup-bun's install location on Linux runners).
        run: bun run test

      # The Sandbox page (GET /mcp) in a real browser, used by real MCP clients.
      - name: Sandbox in Chromium with MCP clients
        run: bun test/sandbox-browser.ts

  cli:
    name: mcp CLI (typecheck, unit, end-to-end)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The end-to-end suite boots a local wrangler api, so the api's
      # dependencies must be installed even though the CLI itself has none.
      - name: Install api dependencies
        working-directory: api
        run: npm ci

      # A malformed ${{ }} is still valid YAML, so only GitHub's parser rejects
      # it - catch it here instead of in a red workflow run.
      - name: Validate workflow files
        run: bun scripts/check-workflows.ts

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: cli
        run: bun run typecheck

      - name: Unit tests
        working-directory: cli
        run: bun test

      - name: End-to-end tests
        working-directory: cli
        run: bun test/e2e.ts

  # The same CLI suites on Windows, x64 and Arm: the release ships .exe builds
  # for both, so they must actually run there - not just cross-compile.
  cli-windows:
    name: mcp CLI on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node-arch: x64
          # workerd (wrangler's local runtime, used by the end-to-end gateway)
          # has no Windows Arm build, so Node runs as x64 under Windows'
          # emulation there. Bun - and so the CLI under test - stays native Arm.
          - os: windows-11-arm
            node-arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.node-arch }}

      - name: Install gateway dependencies
        working-directory: api
        run: npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: cli
        run: bun run typecheck

      - name: Unit tests
        working-directory: cli
        run: bun test

      - name: End-to-end tests
        working-directory: cli
        run: bun test/e2e.ts

      # The release ships this platform's .exe from a cross-compile on Linux;
      # build it natively too and make sure it starts and serves.
      - name: Build and smoke-test the native binary
        working-directory: cli
        run: bun scripts/build.ts --host-only

  # 'mcp service' against each OS's real service manager: a systemd user unit,
  # a launchd agent, a Scheduled Task - installed, exercised, uninstalled.
  cli-service:
    name: mcp service on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      # CI jobs have no login session, so no systemd user manager: start one.
      - name: Start a systemd user session
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for i in $(seq 1 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user is-system-running || true

      - name: Install, exercise and uninstall the service
        working-directory: cli
        run: bun test/service-e2e.ts

      # A root installed in the OS store (how IT deploys TLS inspection) must be
      # trusted by the service's tunnel: NODE_USE_SYSTEM_CA=1 is what makes it so.
      - name: OS certificate store is trusted (NODE_USE_SYSTEM_CA)
        working-directory: cli
        env:
          CODE_MCP_SYSTEM_CA_TEST: '1'
        run: bun test/system-ca.ts

  # The device server that the CLI embeds. Its tests exercise the PowerShell
  # launcher (against a real PowerShell, present on all three runners) and the
  # spawn environment, and that the server starts.
  device-server:
    name: device server on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Tests (Python harness over the TS launcher)
        run: python -m unittest discover -s tests -v

      - name: The implementation starts
        shell: bash
        run: |
          set -euo pipefail
          bun src/code-mcp.ts --help | head -1
