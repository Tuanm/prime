name: Release CLI

# Cuts a GitHub Release containing the prime binaries for every supported
# platform, plus the portable JS bundle and a checksum file.
#
#   git tag prime-v26.10.3 && git push origin prime-v26.10.3
#
# Versions are dates (26.10.3 = 2026-10-03), which tells a user how stale their
# download is. They must still be valid SemVer, so the day is not zero-padded.
# A second release on the same day uses build metadata: prime-v26.10.3+1.
#
# The tag drives the version baked into the binaries; a manual run builds the
# same artifacts and uploads them as workflow artifacts without publishing a
# release.

on:
  push:
    tags:
      - "prime-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z). Defaults to the tag, else cli/package.json."
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build prime for all platforms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # A tag like prime-v26.10.3 publishes version 26.10.3; the binaries report it.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION:-}"
          elif [ "${REF_TYPE:-}" = "tag" ]; then
            VERSION="${REF_NAME#prime-v}"
          else
            VERSION="$(node -p "require('./cli/package.json').version")"
          fi
          # Same rule as cli/src/version.ts, checked coarsely here and
          # strictly in the build itself: a date version must stay valid SemVer,
          # which means no zero padding (26.10.3, not 26.10.03).
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "invalid version: $VERSION - use a date like 26.10.3 (no zero padding), optionally 26.10.3+1" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building prime $VERSION"

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: cli
        run: bun run typecheck

      # Fast, hermetic checks. The full end-to-end suite (which boots wrangler)
      # runs in ci.yml on every push.
      - name: Unit tests
        working-directory: cli
        run: bun test

      - name: Build every target
        working-directory: cli
        run: bun run build --version "${{ steps.version.outputs.version }}"

      - name: Package artifacts
        working-directory: cli/dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -f prime-e2e
          # Release names carry the version; the raw build names do not.
          for file in prime-*; do
            case "$file" in
              # Explicit per platform: a "*.exe" pattern would fold the x64 and
              # Arm Windows builds into one name and silently drop one of them.
              prime-windows-x64.exe)   mv "$file" "prime-$VERSION-windows-x64.exe" ;;
              prime-windows-arm64.exe) mv "$file" "prime-$VERSION-windows-arm64.exe" ;;
              prime-darwin-arm64)   mv "$file" "prime-$VERSION-darwin-arm64" ;;
              prime-darwin-x64)     mv "$file" "prime-$VERSION-darwin-x64" ;;
              prime-linux-x64)      mv "$file" "prime-$VERSION-linux-x64" ;;
              prime-linux-arm64)    mv "$file" "prime-$VERSION-linux-arm64" ;;
            esac
          done
          mv prime.js "prime-$VERSION.js"
          rm -f prime
          # Checksums, so a download can be verified before it is made executable.
          sha256sum prime-* > SHA256SUMS
          ls -la
          cat SHA256SUMS

      # The codespace image that 'prime spaces create' pulls. Built only for a
      # tag: a dispatch run builds the binaries and stops there.
      - name: Set up QEMU
        if: github.ref_type == 'tag'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: github.ref_type == 'tag'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the space image
        if: github.ref_type == 'tag'
        working-directory: cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # OCI repository names are lowercase; GitHub logins are not.
          IMAGE="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/prime-space"
          # One image per architecture, then a manifest list so the tag works on
          # both. The Dockerfile lives in the source tree; the binaries are in
          # dist/ after the packaging step, and come from one build.
          docker buildx build --platform linux/amd64 \
            --build-arg BIN=prime-$VERSION-linux-x64 \
            -f spaces/Dockerfile -t "$IMAGE:$VERSION-amd64" --push dist
          docker buildx build --platform linux/arm64 \
            --build-arg BIN=prime-$VERSION-linux-arm64 \
            -f spaces/Dockerfile -t "$IMAGE:$VERSION-arm64" --push dist
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          echo "pushed $IMAGE:$VERSION (linux/amd64, linux/arm64)"
          echo "image_pushed=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT" || true

      # Public is what makes 'prime spaces' work without a registry login. A
      # token without package scopes cannot flip it, so this is best effort; the
      # package settings page can do it too.
      - name: Make the space image public
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "/user/packages/container/prime-space" -f visibility=public

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prime-${{ steps.version.outputs.version }}
          path: |
            cli/dist/prime-*
            cli/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        working-directory: cli/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A quoted heredoc: nothing inside is expanded, so backticks and
          # angle brackets in the markdown survive verbatim. Writing the notes
          # to a file beats a multi-line --notes argument, which is one quoting
          # mistake away from mangling the release body.
          cat > RELEASE_NOTES.md <<'NOTES'
          Standalone `prime` CLI for the Prime gateway.

          ## Install

          Download the file for your platform, make it executable and put it on your PATH:

          ```bash
          chmod +x prime-<version>-darwin-arm64
          sudo mv prime-<version>-darwin-arm64 /usr/local/bin/prime
          prime --version
          ```

          | Platform | Artifact |
          | --- | --- |
          | macOS (Apple silicon) | `prime-<version>-darwin-arm64` |
          | macOS (Intel) | `prime-<version>-darwin-x64` |
          | Linux (x64 / arm64) | `prime-<version>-linux-x64` / `prime-<version>-linux-arm64` |
          | Windows (x64 / Arm) | `prime-<version>-windows-x64.exe` / `prime-<version>-windows-arm64.exe` |

          The binaries are self-contained (the Bun runtime is embedded), so no runtime
          installation is needed. They are large for that reason. If Bun >= 1.2 is already
          installed, `prime-<version>.js` is a ~240 KB alternative (code-mcp included) that runs with
          `bun prime-<version>.js`.

          Verify a download against `SHA256SUMS`:

          ```bash
          shasum -a 256 -c SHA256SUMS --ignore-missing
          ```

          `prime spaces create` pulls the `ghcr.io/<owner>/prime-space:<version>` image
          (linux/amd64 and linux/arm64); make that package public once in its settings,
          or run `container registry login ghcr.io` first.

          Run `prime --help` for commands, or see
          [cli/README.md](https://github.com/${{ github.repository }}/blob/main/cli/README.md)
          for configuration, exit codes and the cross-platform input forms.
          NOTES
          gh release create "$TAG" --title "prime $VERSION" --notes-file RELEASE_NOTES.md prime-* SHA256SUMS
