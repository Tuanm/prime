name: Release CLI

# Cuts a GitHub Release containing the prime binaries for every supported
# platform, plus the portable JS bundle and a checksum file.
#
#   git tag prime-v26.10.3 && git push origin prime-v26.10.3
#
# Versions are dates (26.10.3 = 2026-10-03), which tells a user how stale their
# download is. They must still be valid SemVer, so the day is not zero-padded.
# A second release on the same day uses build metadata: prime-v26.10.3+1.
#
# The tag drives the version baked into the binaries; a manual run builds the
# same artifacts and uploads them as workflow artifacts without publishing a
# release.

on:
  push:
    tags:
      - "prime-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z). Defaults to the tag, else cli/package.json."
        required: false
        type: string

# Read-only unless a job says otherwise: the job that runs the tests (and so the project's dependencies) can
# write nothing. Only the job that builds and publishes has write permissions, and it runs no test and no
# install script.
permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # A tag like prime-v26.10.3 publishes version 26.10.3; the binaries report it.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION:-}"
          elif [ "${REF_TYPE:-}" = "tag" ]; then
            VERSION="${REF_NAME#prime-v}"
          else
            VERSION="$(node -p "require('./cli/package.json').version")"
          fi
          # Same rule as cli/src/version.ts, checked coarsely here and
          # strictly in the build itself: a date version must stay valid SemVer,
          # which means no zero padding (26.10.3, not 26.10.03).
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "invalid version: $VERSION - use a date like 26.10.3 (no zero padding), optionally 26.10.3+1" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building prime $VERSION"

      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: cli
        run: bun run typecheck

      # Fast, hermetic checks. The full end-to-end suite (which boots wrangler)
      # runs in ci.yml on every push.
      - name: Unit tests
        working-directory: cli
        run: bun test

  release:
    name: Build prime for all platforms
    needs: test
    runs-on: ubuntu-latest
    # The only job that can write: it builds, pushes the image and makes the draft. It runs no test and no
    # install script of the project's dependencies.
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install CLI dependencies without running their scripts
        working-directory: cli
        run: bun install --frozen-lockfile --ignore-scripts

      # The codespace image that 'prime spaces create' pulls. Built only for a
      # tag: a dispatch run builds the binaries and stops there. It is built
      # BEFORE the release binaries, because the binaries name it by digest
      # (a tag can be moved afterwards, a digest cannot).
      - name: Set up QEMU
        if: github.ref_type == 'tag'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          # The emulator image, by digest (the current tonistiigi/binfmt at the time of pinning).
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Buildx
        if: github.ref_type == 'tag'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          # The builder image, by digest (moby/buildkit:buildx-stable-1 at the time of pinning).
          driver-opts: image=moby/buildkit@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The binary that runs inside the image cannot name the image's own digest
      # (the digest depends on the binary), so it is a separate Linux build that
      # uses the version's tag. The binaries that are released are built after.
      - name: Build the binaries for the space image
        if: github.ref_type == 'tag'
        working-directory: cli
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p image-bin
          for arch in x64 arm64; do
            bun run build --no-bundle --target "linux-$arch" --version "$VERSION"
            mv "dist/prime-linux-$arch" "image-bin/prime-$VERSION-linux-$arch"
          done

      - name: Build and push the space image
        id: image
        if: github.ref_type == 'tag'
        working-directory: cli
        env:
          VERSION: ${{ needs.test.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # OCI repository names are lowercase; GitHub logins are not.
          IMAGE="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/prime-space"
          # One image per architecture, then a manifest list so the tag works on
          # both. The Dockerfile lives in the source tree.
          docker buildx build --platform linux/amd64 \
            --build-arg BIN=prime-$VERSION-linux-x64 \
            -f spaces/Dockerfile -t "$IMAGE:$VERSION-amd64" --push image-bin
          docker buildx build --platform linux/arm64 \
            --build-arg BIN=prime-$VERSION-linux-arm64 \
            -f spaces/Dockerfile -t "$IMAGE:$VERSION-arm64" --push image-bin
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          # The digest of the manifest list: what 'prime spaces' will pull, by content.
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "unexpected image digest: $DIGEST" >&2
            exit 1
          fi
          echo "pushed $IMAGE:$VERSION = $IMAGE@$DIGEST (linux/amd64, linux/arm64)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"

      # Public is what makes 'prime spaces' work without a registry login. A
      # token without package scopes cannot flip it, so this is best effort; the
      # package settings page can do it too.
      - name: Make the space image public
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "/user/packages/container/prime-space" -f visibility=public

      - name: Build every target
        working-directory: cli
        env:
          VERSION: ${{ needs.test.outputs.version }}
          # Empty for a dispatch run, which builds no image.
          SPACE_IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          ARGS=(--version "$VERSION")
          if [ -n "${SPACE_IMAGE:-}" ]; then
            ARGS+=(--space-image "$SPACE_IMAGE")
          fi
          bun run build "${ARGS[@]}"

      - name: Package artifacts
        working-directory: cli/dist
        env:
          VERSION: ${{ needs.test.outputs.version }}
          SPACE_IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          rm -f prime-e2e
          # Release names carry the version; the raw build names do not.
          for file in prime-*; do
            case "$file" in
              # Explicit per platform: a "*.exe" pattern would fold the x64 and
              # Arm Windows builds into one name and silently drop one of them.
              prime-windows-x64.exe)   mv "$file" "prime-$VERSION-windows-x64.exe" ;;
              prime-windows-arm64.exe) mv "$file" "prime-$VERSION-windows-arm64.exe" ;;
              prime-darwin-arm64)   mv "$file" "prime-$VERSION-darwin-arm64" ;;
              prime-darwin-x64)     mv "$file" "prime-$VERSION-darwin-x64" ;;
              prime-linux-x64)      mv "$file" "prime-$VERSION-linux-x64" ;;
              prime-linux-arm64)    mv "$file" "prime-$VERSION-linux-arm64" ;;
            esac
          done
          mv prime.js "prime-$VERSION.js"
          rm -f prime
          # Checksums, so a download can be verified before it is made executable.
          sha256sum prime-* > SHA256SUMS
          # RELEASE ties the version to the checksums (and names the space image by
          # digest). It is signed after the build, with a key that is not here, and
          # 'prime update' installs only a release whose RELEASE.sig verifies.
          {
            echo "prime-release-v1"
            echo "version $VERSION"
            echo "sha256sums $(sha256sum SHA256SUMS | cut -d' ' -f1)"
            if [ -n "${SPACE_IMAGE_REF:-}" ]; then echo "space-image $SPACE_IMAGE_REF"; fi
          } > RELEASE
          ls -la
          cat SHA256SUMS RELEASE

      # RELEASE and SHA256SUMS as this run made them, kept apart from the (large) binaries: whoever signs the draft
      # checks that the draft holds exactly these, so that a draft changed after the build is not signed.
      - name: Upload the release record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-record-${{ needs.test.outputs.version }}
          path: |
            cli/dist/SHA256SUMS
            cli/dist/RELEASE
          if-no-files-found: error
          retention-days: 90

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prime-${{ needs.test.outputs.version }}
          path: |
            cli/dist/prime-*
            cli/dist/SHA256SUMS
            cli/dist/RELEASE
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        working-directory: cli/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.test.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A quoted heredoc: nothing inside is expanded, so backticks and
          # angle brackets in the markdown survive verbatim. Writing the notes
          # to a file beats a multi-line --notes argument, which is one quoting
          # mistake away from mangling the release body.
          cat > RELEASE_NOTES.md <<'NOTES'
          Standalone `prime` CLI for the Prime gateway.

          ## Install

          Download the file for your platform, make it executable and put it on your PATH:

          ```bash
          chmod +x prime-<version>-darwin-arm64
          sudo mv prime-<version>-darwin-arm64 /usr/local/bin/prime
          prime --version
          ```

          | Platform | Artifact |
          | --- | --- |
          | macOS (Apple silicon) | `prime-<version>-darwin-arm64` |
          | macOS (Intel) | `prime-<version>-darwin-x64` |
          | Linux (x64 / arm64) | `prime-<version>-linux-x64` / `prime-<version>-linux-arm64` |
          | Windows (x64 / Arm) | `prime-<version>-windows-x64.exe` / `prime-<version>-windows-arm64.exe` |

          The binaries are self-contained (the Bun runtime is embedded), so no runtime
          installation is needed. They are large for that reason. If Bun >= 1.2 is already
          installed, `prime-<version>.js` is a ~240 KB alternative (code-mcp included) that runs with
          `bun prime-<version>.js`.

          Verify a download against `SHA256SUMS`:

          ```bash
          shasum -a 256 -c SHA256SUMS --ignore-missing
          ```

          `RELEASE` and `RELEASE.sig` are the release's signature: `prime update` installs only
          a release whose `RELEASE.sig` verifies against the prime release key built into the
          CLI, and `RELEASE` also names the codespace image by digest.

          `prime spaces create` pulls that image (linux/amd64 and linux/arm64) by digest from
          `ghcr.io/<owner>/prime-space`; make that package public once in its settings,
          or run `container registry login ghcr.io` first.

          Run `prime --help` for commands, or see
          [cli/README.md](https://github.com/${{ github.repository }}/blob/main/cli/README.md)
          for configuration, exit codes and the cross-platform input forms.
          NOTES
          # A draft: it is published after RELEASE is signed (RELEASE.sig is uploaded
          # with the signature, then the draft is published). 'prime update' does not
          # see a draft, and refuses a release without a valid signature.
          gh release create "$TAG" --draft --verify-tag --title "prime $VERSION" --notes-file RELEASE_NOTES.md prime-* SHA256SUMS RELEASE
